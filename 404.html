<style>/* Layout concept: "Editorial ledger" — an asymmetric 12-column grid where midnight sections carry evidence

  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

.s-navy { background-color: var(--navy); color: var(--on-navy); --ink: var(--on-navy); --ink-2: var(--on-navy-2); --ink-3: var(--on-navy-3); --rule: var(--navy-rule); --copper-ink: var(--copper); --stone: var(--navy-2); --ivory: var(--navy); }

  radial-gradient(60% 70% at 82% 18%, rgba(212, 165, 74, 0.16), transparent 62%),

.story .role li::before { content: ""; position: absolute; left: 0; top: 0.78em; width: 12px; height: 1px; background: var(--copper); }
.sig { grid-column: 1 / -1; margin-top: clamp(40px, 5vw, 64px); display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 10fr); gap: 24px; padding-top: 22px; border-top: 1px solid var(--rule); }
.sig span { font: 600 var(--t-label)/1.6 var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--copper-ink); }
.sig p { font: 500 clamp(1.35rem, 1.1rem + 0.9vw, 1.9rem)/1.3 var(--serif); color: var(--ink); max-width: 46ch; }
/* layout: flow (text left, diagram right) */
.st-text { grid-column: 1 / span 6; min-width: 0; }
.st-vis { grid-column: 8 / span 5; min-width: 0; align-self: center; }
.flow { display: grid; gap: 34px; }
.flow-row { display: grid; grid-template-columns: minmax(0, 1fr) 56px minmax(0, 1.25fr); align-items: center; }
.node b { display: block; font: 500 clamp(2.4rem, 1.6rem + 2.4vw, 3.8rem)/0.95 var(--serif); color: var(--ink); font-variant-numeric: lining-nums; }
.node.hot b { color: var(--copper-ink); font-size: clamp(3rem, 1.8rem + 3.4vw, 5.2rem); }
.node span { display: block; margin-top: 8px; font-size: 0.86rem; line-height: 1.4; color: var(--ink-2); max-width: 22ch; }
.arrow { position: relative; height: 1px; background: var(--copper); margin-inline: 8px; }
.arrow::after { content: ""; position: absolute; right: -1px; top: -4px; width: 8px; height: 8px; border-top: 1px solid var(--copper); border-right: 1px solid var(--copper); transform: rotate(45deg); }
.flow-sep { height: 1px; background: var(--rule); }
.flow-extra { display: flex; gap: 18px; align-items: baseline; padding: 18px 20px; border: 1px solid var(--rule); background: color-mix(in srgb, var(--stone) 60%, transparent); }
.flow-extra b { font: 500 2.4rem/1 var(--serif); color: var(--ink); }
.flow-extra span { font-size: 0.88rem; color: var(--ink-2); }
/* layout: bars (visual left, text right) */
.st-vis.left { grid-column: 1 / span 6; grid-row: 2; }
.st-text.right { grid-column: 8 / span 5; grid-row: 2; }
.bars { display: grid; gap: 26px; }
.bars .cap { font: 600 var(--t-label)/1 var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); }
.bar-row { display: grid; grid-template-columns: 7.5rem minmax(0, 1fr); align-items: center; gap: 18px; }
.bar-row b { font: 500 clamp(3rem, 2rem + 3vw, 5.4rem)/0.9 var(--serif); font-variant-numeric: lining-nums; }
.bar-row.to b { color: var(--copper-ink); }
.track { height: 18px; background: repeating-linear-gradient(90deg, var(--rule) 0 1px, transparent 1px calc(100% / 25)); position: relative; }
.track i { position: absolute; inset: 0 auto 0 0; background: var(--ink-3); transform-origin: left; transition: transform 1.2s cubic-bezier(.2,.7,.1,1); }
.bar-row.to .track i { background: var(--copper); }
.track.pre i { transform: scaleX(0); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.chips li { font: 600 0.75rem/1 var(--sans); letter-spacing: 0.06em; padding: 9px 12px; border: 1px solid var(--rule); color: var(--ink-2); background: var(--ivory); }
.statline { display: flex; gap: 16px; align-items: baseline; padding-top: 18px; border-top: 1px solid var(--rule); }
.statline b { font: 500 2.6rem/1 var(--serif); }
.statline span { font-size: 0.88rem; color: var(--ink-2); }
/* layout: wide */
.st-wide-t { grid-column: 1 / span 10; }
.st-stats { grid-column: 1 / -1; display: grid; grid-template-columns: 1.6fr repeat(3, minmax(0, 1fr)); margin-top: clamp(40px, 5vw, 64px); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.st-stats div { padding: 26px 22px 26px 0; min-width: 0; }

.st-stats b { display: block; font: 500 clamp(2.4rem, 1.6rem + 2.2vw, 3.6rem)/0.95 var(--serif); font-variant-numeric: lining-nums; }
.st-stats div:first-child b { font-size: clamp(4.2rem, 2rem + 6vw, 8.4rem); color: var(--copper-ink); }
.st-stats span { display: block; margin-top: 10px; font-size: 0.88rem; color: var(--ink-2); }
.st-cols { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: clamp(16px, 2vw, 28px); margin-top: 36px; }
.st-cols .ctx { grid-column: 1 / span 5; margin-top: 0; }
.st-cols .rolebox { grid-column: 7 / span 6; }
.st-cols .rolebox .role-h { margin-top: 0; }
/* compact pair */
.pair { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(24px, 4vw, 64px); }
.mini { display: grid; align-content: start; gap: 16px; padding-top: 26px; border-top: 1px solid var(--ink); min-width: 0; }

.mini b.big { font: 500 clamp(4.4rem, 2.4rem + 5vw, 7.4rem)/0.85 var(--serif); color: var(--copper-ink); font-variant-numeric: lining-nums; margin-top: 10px; }

@media (max-width: 1020px) {
  .st-text, .st-vis, .st-vis.left, .st-text.right, .st-wide-t { grid-column: 1 / -1; grid-row: auto; }

  .st-vis.left { margin-top: 48px; }

  .st-cols .rolebox { margin-top: 24px; }
  .st-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .st-stats div:nth-child(odd) { padding-left: 0; border-left: 0; }
  .st-stats div:nth-child(n+3) { border-top: 1px solid var(--rule); }
  .pair { grid-template-columns: 1fr; }
  .sig { grid-template-columns: 1fr; gap: 10px; }
}
@media (max-width: 560px) {
  .flow-row { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .arrow { width: 56px; transform: rotate(90deg); transform-origin: left; margin: 10px 0 18px 8px; }
  .bar-row { grid-template-columns: 5.4rem minmax(0, 1fr); }
  .st-stats { grid-template-columns: 1fr; }
  .st-stats div, .st-stats div + div { padding-left: 0; border-left: 0; border-top: 1px solid var(--rule); }
  .st-stats div:first-child { border-top: 0; }

/* ---------- Regional footprint ---------- */
.map-copy { grid-column: 1 / span 5; min-width: 0; }
.map-copy .h2 { margin-top: 26px; }
.map-copy > p { margin-top: 22px; color: var(--on-navy-2); max-width: 44ch; }
.legend { margin-top: 36px; display: grid; gap: 26px; }
.legend h3 { font: 600 0.7rem/1.3 var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--on-navy-3); display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.legend h3 i { width: 14px; height: 14px; flex: none; border: 1px solid var(--copper); }
.legend .k-home i { background: var(--copper); }
.legend .k-built i { background: color-mix(in srgb, var(--copper) 55%, var(--navy)); }
.legend .k-grew i { background: color-mix(in srgb, #A9B4C4 55%, var(--navy)); border-color: #A9B4C4; }
.legend .k-bid i { border-style: dashed; border-color: var(--on-navy-2); }
.legend button { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 12px; width: 100%; padding: 10px 0; border-bottom: 1px solid var(--navy-rule); cursor: default; }
.legend button:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
.legend button b { font: 500 1.3rem/1.2 var(--serif); }
.legend button span { font-size: 0.85rem; color: var(--on-navy-2); line-height: 1.45; }
.legend button:hover b, .legend button.on b { color: var(--copper); }
.map-fig { grid-column: 7 / span 6; margin: 0; position: sticky; top: calc(var(--nav-h) + 24px); align-self: start; min-width: 0; }
.map-fig svg { width: 100%; height: auto; display: block; -webkit-mask-image: linear-gradient(to right, transparent 0, #000 9%, #000 94%, transparent 100%), linear-gradient(to bottom, transparent 0, #000 7%, #000 93%, transparent 100%); -webkit-mask-composite: source-in; mask-image: linear-gradient(to right, transparent 0, #000 9%, #000 94%, transparent 100%), linear-gradient(to bottom, transparent 0, #000 7%, #000 93%, transparent 100%); mask-composite: intersect; }
.map-fig figcaption { font-size: 0.75rem; color: var(--on-navy-3); margin-top: 10px; }
.land { fill: var(--navy-2); stroke: var(--navy-rule); stroke-width: 0.8; transition: fill .3s; }
.land.c-home { fill: var(--copper); stroke: var(--copper); }
.land.c-built { fill: color-mix(in srgb, var(--copper) 55%, var(--navy)); stroke: var(--copper); }
.land.c-grew { fill: color-mix(in srgb, #A9B4C4 55%, var(--navy)); stroke: #A9B4C4; }
.land.c-bid { fill: url(#hatch); stroke: var(--on-navy-2); stroke-dasharray: 3 3; }
.land.hot { fill: #A9B4C4; stroke: var(--on-navy); }
.ray { stroke: var(--copper); stroke-width: 1; fill: none; stroke-dasharray: 2 4; opacity: 0.85; }
.ctry { font: 600 11px var(--sans); letter-spacing: 0.1em; text-transform: uppercase; fill: var(--on-navy); paint-order: stroke; stroke: var(--navy); stroke-width: 3px; pointer-events: none; }
.ctry.dim { fill: var(--on-navy-2); }
.miles { grid-column: 1 / -1; margin-top: clamp(56px, 7vw, 96px); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); position: relative; }
.miles::before { content: ""; position: absolute; left: 0; right: 0; top: 7px; height: 1px; background: var(--navy-rule); }
.miles li { position: relative; padding: 34px 24px 0 0; min-width: 0; }
.miles li::before { content: ""; position: absolute; left: 0; top: 2px; width: 11px; height: 11px; background: var(--navy); border: 1px solid var(--copper); transform: rotate(45deg); }
.miles li:last-child::before { background: var(--copper); }
.miles .w { font: 600 0.75rem/1 var(--sans); letter-spacing: 0.1em; color: var(--copper); }
.miles .o { font: 500 1.6rem/1.1 var(--serif); margin-top: 8px; }
.miles p { margin-top: 10px; font-size: 0.9rem; color: var(--on-navy-2); }
.miles-h { grid-column: 1 / -1; margin-top: clamp(56px, 7vw, 96px); font: 500 clamp(1.8rem, 1.3rem + 1.5vw, 2.6rem)/1.1 var(--serif); }
.miles-h + .miles { margin-top: 32px; }
@media (max-width: 1020px) {
  .map-copy, .map-fig { grid-column: 1 / -1; }
  .map-fig { position: static; order: -1; max-width: 560px; margin-bottom: 40px; }
  .legend button { grid-template-columns: 1fr; gap: 2px; }
  .miles { grid-template-columns: 1fr; }
  .miles::before { left: 5px; right: auto; top: 0; bottom: 0; width: 1px; height: auto; }
  .miles li { padding: 0 0 28px 34px; }
  .miles li::before { top: 4px; }
}

/* ---------- Organisations ---------- */
.orgs { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: clamp(14px, 1.6vw, 22px); }
.org { display: grid; gap: 12px; align-content: start; text-decoration: none; color: inherit; min-width: 0; }
.org .box { position: relative; aspect-ratio: 16 / 10; background: var(--tile); border: 1px solid var(--tile-rule); display: grid; place-items: center; padding: 18px; transition: transform .35s cubic-bezier(.2,.7,.1,1), border-color .25s, box-shadow .35s; }
.org .box img { width: auto; max-width: 78%; object-fit: contain; }
.org .box .wordmark { font: 800 1.05rem/1.1 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: #3E4757; text-align: center; }
.org .box .wordmark small { display: block; font-weight: 600; font-size: 0.62rem; letter-spacing: 0.14em; color: #7A808B; margin-top: 6px; }
.org .go { position: absolute; right: 10px; top: 10px; width: 14px; height: 14px; color: #8C6A24; opacity: 0; transition: opacity .25s; }
a.org:hover .box, a.org:focus-visible .box { transform: translateY(-4px); border-color: var(--copper); box-shadow: 0 18px 30px -22px rgba(17, 28, 46, 0.45); }
a.org:hover .go, a.org:focus-visible .go { opacity: 1; }

.org .nm { font: 700 0.95rem/1.25 var(--sans); }
.org .rl { font-size: 0.82rem; line-height: 1.4; color: var(--ink-2); margin-top: -6px; }
.org .yr { font: 600 0.68rem/1.3 var(--sans); letter-spacing: 0.12em; text-transform: uppercase; color: var(--copper-ink); margin-top: -4px; }
.disc { grid-column: 1 / -1; margin-top: 28px; font-size: 0.78rem; color: var(--ink-3); }
@media (max-width: 1100px) { .orgs { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 860px) { .orgs { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .orgs { grid-template-columns: repeat(2, minmax(0, 1fr)); } .org .box { padding: 12px; } }

/* Compact chronology */
.chrono { grid-column: 1 / -1; margin-top: clamp(48px, 6vw, 80px); border-top: 1px solid var(--ink); }
.chrono > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 22px 0; }
.chrono > summary::-webkit-details-marker { display: none; }
.chrono > summary h3 { font: 500 clamp(1.6rem, 1.2rem + 1vw, 2.2rem)/1.1 var(--serif); }
.chrono > summary span.sub { display: block; font-size: 0.85rem; color: var(--ink-3); margin-top: 4px; }
.plus { width: 44px; height: 44px; border: 1px solid var(--rule); display: grid; place-items: center; flex: none; transition: background .25s; }
.plus svg { width: 14px; height: 14px; transition: transform .35s; }

details[open] > summary .plus svg { transform: rotate(45deg); }
.chrono-axis, .ch-row { display: grid; grid-template-columns: 10.5rem minmax(0, 2.2fr) minmax(0, 1.4fr) minmax(0, 2.4fr); gap: 20px; align-items: center; }
.chrono-axis { padding: 8px 0; border-bottom: 1px solid var(--rule); font: 600 0.68rem/1 var(--sans); letter-spacing: 0.1em; color: var(--ink-3); }
.chrono-axis .trk { position: relative; height: 12px; }
.chrono-axis .trk span { position: absolute; transform: translateX(-50%); }
.chrono-axis .trk span:first-child { transform: none; }
.ch-row { padding: 12px 0; border-bottom: 1px solid var(--rule); font-size: 0.9rem; }
.ch-row .d { font-size: 0.78rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.ch-row .t { font-weight: 600; line-height: 1.3; }
.ch-row .o { color: var(--ink-2); line-height: 1.3; }
.ch-row .o em { display: block; font-style: normal; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--copper-ink); margin-top: 3px; }
.bar { position: relative; height: 10px; background: linear-gradient(to right, var(--rule) 1px, transparent 1px) 0 0 / calc(100% / 22) 100%; }
.bar i { position: absolute; top: 2px; height: 6px; background: var(--ink); }
.bar i.part { background: repeating-linear-gradient(135deg, var(--copper) 0 2px, transparent 2px 5px); outline: 1px solid var(--copper); outline-offset: -1px; }
.bar i.now { background: var(--copper); }
.ch-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; padding: 18px 0 8px; font-size: 0.8rem; color: var(--ink-3); }
.key { display: flex; gap: 18px; flex-wrap: wrap; }
.key span { display: inline-flex; align-items: center; gap: 8px; }
.key i { display: inline-block; width: 22px; height: 6px; background: var(--ink); }
.key i.part { background: repeating-linear-gradient(135deg, var(--copper) 0 2px, transparent 2px 5px); outline: 1px solid var(--copper); outline-offset: -1px; }
.key i.now { background: var(--copper); }
@media (max-width: 860px) {
  .chrono-axis { display: none; }
  .ch-row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .ch-row .bar { margin-top: 6px; }
}

/* ---------- Leadership ---------- */
.lead-l { grid-column: 1 / span 5; min-width: 0; }
.lead-l .h2 { margin-top: 26px; }
.lead-l p.lede { margin-top: 22px; font-size: 1.05rem; }
.lead-big { margin-top: clamp(32px, 4vw, 56px); display: grid; gap: 6px; }
.lead-big b { font: 500 clamp(5rem, 3rem + 6vw, 9rem)/0.85 var(--serif); color: var(--copper-ink); letter-spacing: -0.03em; font-variant-numeric: lining-nums; }
.lead-big span { font-size: 0.9rem; color: var(--ink-2); max-width: 28ch; }
.lead-r { grid-column: 7 / span 6; min-width: 0; }
.lead-stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--ink); }

.lead-stats div + div { padding-left: 20px; border-left: 1px solid var(--rule); }
.lead-stats b { display: block; font: 500 clamp(2.6rem, 2rem + 1.6vw, 3.6rem)/1 var(--serif); font-variant-numeric: lining-nums; }
.lead-stats span { display: block; margin-top: 8px; font-size: 0.86rem; color: var(--ink-2); }
.lead-items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; }
.lead-items li { padding: 20px 0 22px; border-top: 1px solid var(--rule); min-width: 0; }
.lead-items h3 { font: 500 1.4rem/1.15 var(--serif); }
.lead-items p { margin-top: 8px; font-size: 0.9rem; color: var(--ink-2); }
@media (max-width: 1020px) { .lead-l, .lead-r { grid-column: 1 / -1; } .lead-r { margin-top: 56px; } }
@media (max-width: 600px) { .lead-items { grid-template-columns: 1fr; } }

/* ---------- Education ---------- */
.edu-l { grid-column: 1 / span 5; min-width: 0; }
.edu-l .h2 { margin-top: 26px; }
.edu-l .lede { margin-top: 22px; font-size: 1.05rem; }
.mba { grid-column: 7 / span 6; position: relative; padding: clamp(28px, 3vw, 44px); border: 1px solid var(--rule); align-self: start; min-width: 0; background: linear-gradient(135deg, color-mix(in srgb, var(--stone) 70%, transparent), transparent 70%); }

.creds { grid-column: 1 / -1; margin-top: clamp(48px, 6vw, 80px); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--ink); }
.creds li { padding: 20px 20px 4px 0; min-width: 0; }
.creds li + li { padding-left: 20px; border-left: 1px solid var(--rule); }
.creds .y { font: 600 0.72rem/1 var(--sans); letter-spacing: 0.12em; color: var(--copper-ink); }
.creds .a { font: 500 1.25rem/1.2 var(--serif); margin-top: 10px; }
.creds .s { font-size: 0.82rem; color: var(--ink-3); margin-top: 6px; }
.creds-x { grid-column: 1 / -1; margin-top: 20px; font-size: 0.82rem; color: var(--ink-3); }
@media (max-width: 1020px) { .edu-l, .mba { grid-column: 1 / -1; } .mba { margin-top: 40px; } .creds { grid-template-columns: repeat(2, minmax(0, 1fr)); } .creds li:nth-child(odd) { padding-left: 0; border-left: 0; } .creds li:nth-child(n+3) { border-top: 1px solid var(--rule); } }
@media (max-width: 560px) { .creds { grid-template-columns: 1fr; } .creds li, .creds li + li { padding-left: 0; border-left: 0; border-top: 1px solid var(--rule); } .creds li:first-child { border-top: 0; } }

/* ---------- Insights (renders only when content.json has items) ---------- */
.ins { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
.ins a { display: grid; gap: 10px; padding-top: 18px; border-top: 1px solid var(--ink); text-decoration: none; }

/* ---------- Contact ---------- */

/* ---------- Footer ---------- */
.foot { background: var(--navy-3); color: var(--on-navy-2); padding-block: 36px 40px; }

/* Reveal: transform only, so content is always readable */
.rv { transition: transform .9s cubic-bezier(.2,.7,.1,1); }
.rv.pre { transform: translateY(20px); }
@media (prefers-reduced-motion: reduce) {

/* ---------- Scroll-driven market story ---------- */
.scrolly { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: clamp(24px, 4vw, 64px); align-items: start; }
.scrolly .map-fig { grid-column: 1; position: sticky; top: calc(var(--nav-h) + 24px); margin: 0; }
.steps { grid-column: 2; display: grid; gap: 0; }
.step { min-height: 72vh; display: flex; flex-direction: column; justify-content: center; padding: 36px 0 36px 28px; border-left: 1px solid var(--navy-rule); position: relative; transition: opacity .5s; }
.scrolly[data-active] .step:not(.on) { opacity: 0.5; }
.step::before { content: ""; position: absolute; left: -6px; top: 50%; width: 11px; height: 11px; background: var(--navy); border: 1px solid var(--copper); transform: rotate(45deg); transition: background .4s; }
.scrolly[data-active] .step.on { opacity: 1; }
.step.on::before { background: var(--copper); }
.step .w { font: 600 0.75rem/1 var(--sans); letter-spacing: 0.14em; color: var(--copper); text-transform: uppercase; }
.step .o { font: 500 clamp(2rem, 1.4rem + 2vw, 3.2rem)/1.02 var(--serif); letter-spacing: -0.02em; margin-top: 12px; }
.step .pos { margin-top: 10px; font-weight: 600; color: var(--on-navy); font-size: 1.02rem; }
.step .what { margin-top: 12px; color: var(--on-navy-2); max-width: 44ch; }
.step.all { min-height: auto; padding-top: 80px; }
.step.all .legend { margin-top: 26px; }
.legend h4 { font: 600 0.7rem/1.3 var(--sans); letter-spacing: 0.14em; text-transform: uppercase; color: var(--on-navy-3); display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.legend h4 i { width: 14px; height: 14px; flex: none; border: 1px solid var(--copper); }
.legend .k-home h4 i { background: var(--copper); }
.legend .k-built h4 i { background: color-mix(in srgb, var(--copper) 55%, var(--navy)); }
.legend .k-grew h4 i { background: color-mix(in srgb, #A9B4C4 55%, var(--navy)); border-color: #A9B4C4; }
.legend .k-bid h4 i { border-style: dashed; border-color: var(--on-navy-2); }
.legend button { grid-template-columns: 8.5rem minmax(0, 1fr); }
.map-fig .city { opacity: 0; transition: opacity .5s; }
.map-fig .city.on { opacity: 1; }
.scrolly[data-active] .land[data-name] { transition: fill .5s, opacity .5s, stroke .5s; }
.scrolly[data-active] .land.c-home, .scrolly[data-active] .land.c-built, .scrolly[data-active] .land.c-grew, .scrolly[data-active] .land.c-bid { opacity: 0.28; }
.scrolly[data-active] .land.lit { opacity: 1; }
.scrolly[data-active] .ray { opacity: 0.15; transition: opacity .5s; }
.scrolly[data-active] .ray.lit { opacity: 1; }
.scrolly[data-active="all"] .land, .scrolly[data-active="all"] .ray { opacity: 1; }
.pulse { transform-origin: center; transform-box: fill-box; animation: pulse 2.4s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: scale(2.4); opacity: 0; } }
.step-ind { display: flex; gap: 6px; margin-bottom: 10px; }
.step-ind i { width: 26px; height: 3px; background: var(--navy-rule); transition: background .4s; }
.step-ind i.on { background: var(--copper); }
.scrolly-sec .chrono { margin-top: clamp(56px, 7vw, 96px); }
.scrolly-sec .chrono > summary .plus { border-color: var(--navy-rule); }
.scrolly-sec details[open] > summary .plus { background: var(--copper); color: #111C2E; border-color: var(--copper); }
.scrolly-sec .bar i { background: var(--on-navy); }
.scrolly-sec .key i { background: var(--on-navy); }
@media (max-width: 900px) {
  .scrolly { grid-template-columns: minmax(0, 1fr); }
  .scrolly .map-fig { grid-column: 1; top: var(--nav-h); z-index: 2; background: var(--navy); padding: 8px 0 6px; margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter); border-bottom: 1px solid var(--navy-rule); }
  .scrolly .map-fig svg { max-height: 27vh; width: auto; max-width: 100%; margin-inline: auto; }
  .scrolly .map-fig figcaption { font-size: 0; margin-top: 4px; }
  .scrolly .map-fig .step-ind { margin: 0; justify-content: center; }
  .scrolly .ctry { font-size: 15px; }
  .steps { grid-column: 1; }
  .step { min-height: 64vh; justify-content: flex-start; padding-top: 18vh; }
  .legend button { grid-template-columns: minmax(0, 1fr); gap: 2px; }
}

/* ---------- 3D logo gallery ---------- */
.orgs-sec { overflow: hidden; }
.ring-stage { --tile-w: clamp(150px, 17vw, 240px); --tile-h: calc(var(--tile-w) * 0.66); --r: calc((var(--tile-w) + 36px) * var(--n, 10) / 6.283); position: relative; height: calc(var(--tile-h) * 2.2 + 80px); perspective: 1500px; perspective-origin: 50% 30%; margin-top: clamp(16px, 3vw, 40px); touch-action: pan-y; cursor: grab; user-select: none; }
.ring-stage.drag { cursor: grabbing; }
.ring { --n: 10; position: absolute; left: 50%; top: 42%; width: 0; height: 0; transform-style: preserve-3d; transform: rotateX(-8deg) rotateY(var(--a, 0deg)); margin: 0; padding: 0; }
.ring-stage .ring { --r: calc((var(--tile-w) + 36px) * var(--n) / 6.283); }
.face { position: absolute; left: calc(var(--tile-w) / -2); top: calc(var(--tile-h) / -2); width: var(--tile-w); height: var(--tile-h); transform: rotateY(calc(var(--i) * 360deg / var(--n))) translateZ(var(--r)); transform-style: preserve-3d; }
.face::before { content: ""; position: absolute; inset: 0; transform: rotateY(180deg); backface-visibility: hidden; -webkit-backface-visibility: hidden; background: linear-gradient(160deg, #141A24, #090C12); border: 1px solid rgba(212, 165, 74, 0.5); box-shadow: 0 0 0 5px rgba(8, 11, 18, 0.6), 0 0 0 6px rgba(212, 165, 74, 0.35); }
.tile { backface-visibility: hidden; -webkit-backface-visibility: hidden; position: relative; display: grid; place-items: center; width: 100%; height: 100%; padding: 18px; background: linear-gradient(160deg, #FFFFFF, #E9EDF2); border: 1px solid rgba(212, 165, 74, 0.65); box-shadow: 0 0 0 5px rgba(8, 11, 18, 0.6), 0 0 0 6px rgba(212, 165, 74, 0.55), 0 30px 50px -20px rgba(0, 0, 0, 0.8), inset 0 0 30px rgba(212, 165, 74, 0.18); text-decoration: none; -webkit-box-reflect: below 14px linear-gradient(transparent 62%, rgba(255, 255, 255, 0.16)); transition: transform .35s cubic-bezier(.2,.7,.1,1), box-shadow .35s; filter: brightness(var(--lit, 1)); }
.tile img { width: auto; max-width: 82%; object-fit: contain; pointer-events: none; }
.tile .wordmark { font: 700 1.05rem/1.15 var(--serif); letter-spacing: 0.06em; text-transform: uppercase; color: #1E2633; text-align: center; }
a.tile:hover, a.tile:focus-visible { transform: translateZ(26px) scale(1.04); box-shadow: 0 0 0 5px rgba(8, 11, 18, 0.6), 0 0 0 6px var(--copper), 0 40px 60px -20px rgba(0, 0, 0, 0.85), inset 0 0 30px rgba(212, 165, 74, 0.25); }
a.tile:focus-visible { outline: 2px solid var(--copper); outline-offset: 8px; }
.ring-ui { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; margin-top: 8px; }
.ring-ctrl { display: flex; gap: 8px; }
.ring-ctrl .icon-btn { min-width: 44px; height: 44px; font-size: 0.85rem; }
.orgs-sec .disc { margin: 0; font-size: 0.78rem; color: var(--on-navy-3); max-width: 60ch; }
.ring-stage.flat { height: auto; perspective: none; cursor: default; }
.ring-stage.flat .ring { position: static; transform: none; width: auto; height: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 22px; padding-inline: var(--gutter); max-width: var(--max); margin-inline: auto; }
.ring-stage.flat .face { position: static; transform: none; width: auto; height: 120px; }
.ring-stage.flat .tile { -webkit-box-reflect: none; }
@media (max-width: 600px) { .ring-stage { --tile-w: 140px; perspective: 900px; } }
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
